project:
  type: website
  resources:
    - images/vignettes/*.png
    - logo/*

lang: fr
language:
  search-text-placeholder: "Rechercher…"

website:
  title: "plutovizu"
  description: "Bibliothèque Python de visualisation de données — API chaînable pour matplotlib"
  favicon: logo/favicon.svg
  open-graph:
    image: logo/open-graph-1200x630.png
  page-navigation: true
  search:
    location: navbar
    type: textbox
  navbar:
    logo:
      light: logo/plutovizu-horizontal-fond-clair.svg
      dark: logo/plutovizu-horizontal-fond-sombre.svg
    logo-alt: "plutovizu"
    title: false
    left:
      - href: index.qmd
        text: Documentation
    right:
      - icon: github
        href: https://github.com/Mr-KAM/plutovizu
        aria-label: GitHub
  sidebar:
    style: docked
    search: false
    contents:
      - section: "Prise en main"
        contents:
          - text: Introduction
            href: index.qmd
          - installation.qmd
      - section: "Graphiques"
        contents:
          - text: Galerie
            href: gallery.qmd
          - charts/evolution.qmd
          - charts/distribution.qmd
          - charts/comparaison.qmd
          - charts/relation.qmd
          - charts/multivarie.qmd
          - charts/composition.qmd
          - charts/champs.qmd
          - charts/3d.qmd
          - charts/sciences.qmd
          - charts/map.qmd
          - charts/ecologie.qmd
          - charts/qualitatif.qmd
          - charts/graphes.qmd
          - charts/seaborn.qmd
      - section: "Mise en forme"
        contents:
          - themes.qmd
          - customization.qmd
      - section: "Référence"
        contents:
          - api.qmd
  page-footer:
    left: "plutovizu v0.1.0 · Licence MIT"
    right: "Propulsé par [Quarto](https://quarto.org)"

format:
  html:
    theme:
      dark: [darkly, custom.scss, dark.scss]
      light: [flatly, custom.scss, light.scss]
    toc: true
    toc-depth: 3
    toc-title: "Sur cette page"
    code-copy: true
    code-overflow: wrap
    highlight-style: github

execute:
  echo: true
  warning: false
  message: false

jupyter: plutovizu
