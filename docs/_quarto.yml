project:
  type: website

lang: fr
language:
  search-text-placeholder: "Rechercher…"

website:
  title: "plutovizu"
  description: "Bibliothèque Python de visualisation de données — API chaînable pour matplotlib"
  favicon: ""
  page-navigation: true
  search:
    location: navbar
    type: textbox
  navbar:
    left:
      - href: index.qmd
        text: Documentation
    right:
      - icon: github
        href: https://github.com/Mr-KAM/plutovizu
        aria-label: GitHub
  sidebar:
    style: docked
    search: false
    contents:
      - section: "Prise en main"
        contents:
          - text: Introduction
            href: index.qmd
          - installation.qmd
      - section: "Créer des graphiques"
        contents:
          - gallery.qmd
          - themes.qmd
          - customization.qmd
      - section: "Référence"
        contents:
          - api.qmd
  page-footer:
    left: "plutovizu v0.1.0 · Licence MIT"
    right: "Propulsé par [Quarto](https://quarto.org)"

format:
  html:
    theme:
      dark: [darkly, custom.scss, dark.scss]
      light: [flatly, custom.scss, light.scss]
    toc: true
    toc-depth: 3
    toc-title: "Sur cette page"
    code-copy: true
    code-overflow: wrap
    highlight-style: github

execute:
  echo: true
  warning: false
  message: false

jupyter: plutovizu
