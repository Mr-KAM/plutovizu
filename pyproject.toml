[project]
name = "plutovizu"
version = "0.1.0"
description = "API chaînable autour de matplotlib pour visualiser des DataFrames pandas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "squarify>=0.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
