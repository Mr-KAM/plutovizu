[project]
name = "plutovizu"
version = "0.1.0"
description = "API chaînable autour de matplotlib pour visualiser des DataFrames pandas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "build>=1.6.1",
    "bumplot>=0.3.0",
    "circlify>=0.16.0",
    "drawarrow>=0.1.0",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "pyfonts>=1.4.2",
    "pypalettes>=0.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "squarify>=0.4.4",
    "twine>=7.0.0",
    "wordcloud>=1.9.6",
]

[project.optional-dependencies]
morethemes = [
    "morethemes>=0.9.0",
]
map = [
    "contextily>=1.7.1",
    "geopandas>=1.2.0",
]
translate = [
    "translate>=3.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "pyyaml>=6.0.3",
    "ipykernel>=7.4.0",
    "morethemes>=0.9.0",  # thèmes optionnels, utilisés par la doc et les tests
    "geopandas>=1.2.0",
    "contextily>=1.7.1",
    "translate>=3.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
